name: Merge Runner

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - master


jobs:
  test-quee:
    name: Build and Test Quee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Using .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Test Suite
        run: dotnet test test/Quee.Memory.Tests/Quee.Memory.Tests.csproj --configuration Release
