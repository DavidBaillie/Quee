name: quee-servicebus-emulator

services:
  servicebus-emulator:
    container_name: "servicebus-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Quee#SQL2024!Dev"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: "5300"
    depends_on:
      - mssql
    networks:
      sb-emulator:
        aliases:
          - "servicebus-emulator"

  mssql:
    container_name: "mssql"
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Quee#SQL2024!Dev"
    networks:
      sb-emulator:
        aliases:
          - "mssql"

networks:
  sb-emulator:
